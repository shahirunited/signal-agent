<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>got milk? Signal Agent · United Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    /* neutral monochrome base */
    --ink:#0a0a0a;          /* app background */
    --panel:#141414;        /* cards / surfaces */
    --panel-2:#1a1a1a;      /* insets */
    --line:#282828;         /* borders */
    --line-2:#363636;       /* hover borders */
    --paper:#fafafa;        /* primary text (near-white) */
    --slate:#8a8a8a;        /* muted text */
    --faint:#5a5a5a;        /* faint text */
    /* purposeful color — data & status only */
    --accent:#5b9dff;       /* signature UI accent */
    --good:#4ade80;         /* strong score */
    --amber:#fbbf24;        /* medium score */
    --coral:#f87171;        /* risk / low */
    --teal:#5b9dff;         /* legacy alias → accent (used by app inline styles) */
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--ink); }
  body { font-family:'Inter', -apple-system, sans-serif; color:var(--paper); -webkit-font-smoothing:antialiased; }
  #root { min-height:100vh; }
  .wrap { max-width:900px; margin:0 auto; padding:40px 24px 64px; }

  /* brand bar */
  .brandbar { display:flex; align-items:center; gap:14px; margin-bottom:34px; }
  .brand-logo { height:34px; width:auto; display:block; opacity:.95; }
  .brand-div { width:1px; height:24px; background:var(--line); }
  .brand-tag { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--slate); }

  .kicker { display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase; margin-bottom:14px; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); animation:pulse 2s ease-in-out infinite; }

  h1.title { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(28px,4.5vw,40px); line-height:1.05; letter-spacing:-.02em; margin:0 0 12px; }
  h1.title span { color:var(--slate); font-weight:500; }
  .subtitle { font-size:14.5px; color:var(--slate); max-width:580px; margin:0 0 30px; line-height:1.6; }

  /* setup panel */
  .setup { border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:22px; margin-bottom:28px; }
  .setup-row { display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .fld { display:flex; flex-direction:column; gap:7px; flex:1; min-width:200px; }
  .fld-label { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
  .fld-input { background:var(--ink); border:1px solid var(--line); border-radius:9px; color:var(--paper); font-family:'Inter',sans-serif; font-size:14px; padding:12px 14px; outline:none; transition:border-color .15s, box-shadow .15s; width:100%; }
  .fld-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,157,255,.12); }
  .fld-input::placeholder { color:var(--faint); }
  .search-input { margin-bottom:16px; }
  .setup-actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .platform-toggles { display:flex; gap:8px; }
  .ptog { display:inline-flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.03em; border:1px solid var(--line); background:transparent; color:var(--slate); padding:10px 14px; border-radius:9px; cursor:pointer; transition:.15s; }
  .ptog:hover { border-color:var(--line-2); color:var(--paper); }
  .ptog .ptog-dot { width:7px; height:7px; border-radius:50%; background:var(--faint); transition:.15s; }
  .ptog.on { border-color:var(--line-2); color:var(--paper); background:var(--panel-2); }
  .ptog.on .ptog-dot { background:var(--accent); box-shadow:0 0 7px var(--accent); }
  .run-actions { display:flex; gap:10px; margin-left:auto; }
  .btn { font-family:'Inter',sans-serif; font-size:13px; font-weight:600; letter-spacing:.01em; border:none; border-radius:9px; padding:12px 20px; display:inline-flex; align-items:center; gap:8px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .btn:active:not(:disabled){ transform:translateY(1px); } .btn:disabled { opacity:.4; cursor:default; }
  .btn-scan { background:var(--paper); color:var(--ink); }
  .btn-scan:hover:not(:disabled){ background:#fff; box-shadow:0 0 0 3px rgba(250,250,250,.1); }
  .btn-export { background:transparent; color:var(--paper); border:1px solid var(--line-2); }
  .btn-export:hover:not(:disabled){ border-color:var(--paper); }
  .spin { animation:spin .9s linear infinite; display:inline-block; }

  .breakdown { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--faint); letter-spacing:.02em; margin-bottom:24px; }
  .breakdown b { color:var(--paper); font-weight:500; }

  .loadlabel { font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:18px; }
  .skel { border:1px solid var(--line); border-radius:12px; padding:22px; margin-bottom:14px; background:var(--panel); }
  .skel-bar { height:11px; border-radius:4px; margin-bottom:11px; background:linear-gradient(90deg,var(--line),#303030,var(--line)); background-size:200% 100%; animation:shimmer 1.5s ease-in-out infinite; }

  .state { border:1px solid var(--line); border-radius:12px; padding:48px 24px; text-align:center; color:var(--slate); background:var(--panel); }
  .state-h { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:19px; letter-spacing:-.01em; color:var(--paper); margin:0 0 8px; }
  .state.err .state-h { color:var(--coral); }
  .state .msg { font-size:13.5px; line-height:1.6; max-width:440px; margin:0 auto 18px; }
  .retry { font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; background:transparent; border:1px solid var(--coral); color:var(--coral); padding:10px 18px; border-radius:8px; cursor:pointer; }
  .retry:hover { background:var(--coral); color:var(--ink); }

  /* opportunity summary */
  .summary-box { border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:22px 24px; margin-bottom:28px; position:relative; overflow:hidden; }
  .summary-box::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); }
  .summary-label { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
  .summary-text { font-size:14.5px; line-height:1.7; margin:0; color:var(--paper); }

  .section-label { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin:0 0 16px; }
  .section-label.risk { color:var(--coral); }

  /* signal cards */
  .sigcard { border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:22px 24px; margin-bottom:14px; transition:border-color .15s; }
  .sigcard:hover { border-color:var(--line-2); }
  .sig-meta { display:flex; align-items:center; gap:12px; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--faint); margin-bottom:12px; flex-wrap:wrap; }
  .sig-num { color:var(--slate); }
  .conf-badge { color:var(--cc); border:1px solid var(--cc); border-radius:5px; padding:3px 9px; font-size:9.5px; letter-spacing:.04em; }
  .sig-overall { color:var(--accent); font-weight:500; }
  .sig-overall-max { color:var(--faint); }
  .sig-plats { margin-left:auto; }
  .sig-title { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:19px; line-height:1.25; letter-spacing:-.01em; margin:0 0 12px; }
  .sig-line { font-size:13.5px; line-height:1.6; margin:0 0 8px; color:var(--paper); }
  .sig-line b { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); margin-right:9px; font-weight:500; }
  .sig-action b { color:var(--accent); }
  /* score grid */
  .scores { display:grid; grid-template-columns:repeat(3,1fr); gap:10px 22px; margin:16px 0 4px; }
  .score { display:flex; align-items:center; gap:10px; }
  .score-label { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.02em; text-transform:uppercase; color:var(--faint); width:62px; flex-shrink:0; }
  .score-bar { flex:1; height:4px; background:var(--line); border-radius:3px; overflow:hidden; }
  .score-fill { height:100%; border-radius:3px; transition:width .4s ease; }
  .score-num { font-family:'JetBrains Mono',monospace; font-size:11px; width:10px; text-align:right; }
  .review-flag { font-size:12.5px; line-height:1.55; color:var(--amber); background:rgba(251,191,36,.07); border:1px solid rgba(251,191,36,.25); border-radius:8px; padding:10px 13px; margin-top:14px; }
  .review-flag b { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; margin-right:7px; }
  .sig-ev { font-size:12px; line-height:1.55; color:var(--slate); margin:12px 0 0; padding:10px 13px; border-left:2px solid var(--line-2); background:var(--panel-2); border-radius:0 6px 6px 0; }
  .sig-ev b { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }

  .listblock { margin-top:28px; }
  .imp-list, .risk-list, .sources-list { margin:0; padding-left:20px; }
  .imp-list li { font-size:13.5px; line-height:1.65; margin-bottom:7px; color:var(--paper); }
  .risk-list li { font-size:13.5px; line-height:1.65; margin-bottom:7px; color:var(--coral); }
  .sources-block { margin-top:28px; padding-top:18px; border-top:1px solid var(--line); }
  .sources-label { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:10px; }
  .sources-list li { font-size:11.5px; line-height:1.6; color:var(--slate); }

  .footer { margin-top:34px; padding-top:20px; border-top:1px solid var(--line); font-size:12px; color:var(--faint); line-height:1.65; }

  button:focus-visible, .fld-input:focus-visible, .ptog:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.5; transform:scale(.85)} }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  @media (prefers-reduced-motion:reduce){ .dot,.spin,.skel-bar,.score-fill{animation:none!important;transition:none!important} }
  @media (max-width:600px){ .run-actions{width:100%;margin-left:0} .btn{flex:1;justify-content:center} .scores{grid-template-columns:repeat(2,1fr)} .sig-plats{margin-left:0;width:100%} }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
