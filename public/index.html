<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signal Agent · United Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:#11151c; --panel:#1b212b; --paper:#f3efe6; --coral:#ff5a3c;
    --amber:#f2b705; --teal:#2bd9c7; --slate:#7c8896; --line:#2a323e;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--ink); }
  body { font-family:'IBM Plex Sans', sans-serif; color:var(--paper); }
  #root { min-height:100vh; }
  .wrap { max-width:880px; margin:0 auto; padding:32px 20px 56px; }

  .brandbar { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .brand-logo { height:44px; width:auto; display:block; }
  .brand-div { width:1px; height:30px; background:var(--line); }
  .brand-tag { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--slate); }

  .kicker { display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.12em; color:var(--slate); text-transform:uppercase; margin-bottom:10px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--coral); animation:blink 1.6s ease-in-out infinite; }
  h1.title { font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:clamp(30px,6vw,54px); line-height:.95; margin:0 0 4px; text-transform:uppercase; }
  h1.title span { color:var(--coral); }
  .subtitle { font-size:14px; color:var(--slate); max-width:560px; margin:0 0 24px; line-height:1.5; }

  /* setup panel */
  .setup { border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:20px; margin-bottom:24px; }
  .setup-row { display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .fld { display:flex; flex-direction:column; gap:6px; flex:1; min-width:200px; }
  .fld-label { font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--slate); }
  .fld-input { background:var(--ink); border:1px solid var(--line); border-radius:7px; color:var(--paper); font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; padding:11px 13px; outline:none; transition:border-color .15s; width:100%; }
  .fld-input:focus { border-color:var(--teal); }
  select.fld-input { cursor:pointer; }
  .search-input { margin-bottom:14px; }
  .search-input::placeholder, .fld-input::placeholder { color:var(--slate); }
  .setup-actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .platform-toggles { display:flex; gap:8px; }
  .ptog { display:inline-flex; align-items:center; gap:7px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; border:1px solid var(--line); background:transparent; color:var(--slate); padding:9px 13px; border-radius:6px; cursor:pointer; transition:.15s; }
  .ptog:hover { border-color:var(--slate); color:var(--paper); }
  .ptog .ptog-dot { width:8px; height:8px; border-radius:50%; background:var(--line); transition:.15s; }
  .ptog.on { border-color:var(--teal); color:var(--paper); }
  .ptog.on .ptog-dot { background:var(--teal); box-shadow:0 0 6px var(--teal); }
  .run-actions { display:flex; gap:10px; margin-left:auto; }
  .btn { font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase; font-weight:500; border:none; border-radius:6px; padding:12px 18px; display:inline-flex; align-items:center; gap:8px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .btn:hover:not(:disabled){ opacity:.88; } .btn:active:not(:disabled){ transform:translateY(1px); } .btn:disabled { opacity:.45; cursor:default; }
  .btn-scan { background:var(--coral); color:var(--ink); }
  .btn-export { background:var(--panel); color:var(--teal); border:1px solid var(--teal); }
  .spin { animation:spin .9s linear infinite; display:inline-block; }

  .breakdown { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--slate); letter-spacing:.04em; margin-bottom:20px; }
  .breakdown b { color:var(--teal); font-weight:500; }

  .loadlabel { font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--teal); margin-bottom:16px; }
  .skel { border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:14px; background:var(--panel); }
  .skel-bar { height:12px; border-radius:3px; margin-bottom:10px; background:linear-gradient(90deg,var(--line),#384252,var(--line)); background-size:200% 100%; animation:shimmer 1.4s ease-in-out infinite; }

  .state { border:1px solid var(--line); border-radius:10px; padding:40px 24px; text-align:center; color:var(--slate); }
  .state-h { font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:22px; letter-spacing:.04em; text-transform:uppercase; color:var(--paper); margin:0 0 8px; }
  .state.err .state-h { color:var(--coral); }
  .state .msg { font-size:13px; line-height:1.55; max-width:460px; margin:0 auto 16px; }
  .retry { font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.05em; text-transform:uppercase; background:transparent; border:1px solid var(--coral); color:var(--coral); padding:9px 16px; border-radius:5px; cursor:pointer; }
  .retry:hover { background:var(--coral); color:var(--ink); }

  /* opportunity summary */
  .summary-box { border:1px solid var(--line); border-left:3px solid var(--teal); background:var(--panel); border-radius:10px; padding:18px 20px; margin-bottom:24px; }
  .summary-label { font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--teal); margin-bottom:8px; }
  .summary-text { font-size:14px; line-height:1.65; margin:0; }

  .section-label { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--slate); margin:0 0 14px; }
  .section-label.risk { color:var(--coral); }

  /* signal cards */
  .sigcard { border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:18px 20px; margin-bottom:14px; }
  .sig-meta { display:flex; align-items:center; gap:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--slate); margin-bottom:10px; flex-wrap:wrap; }
  .sig-num { color:var(--paper); }
  .conf-badge { color:var(--cc); border:1px solid var(--cc); border-radius:4px; padding:2px 8px; font-size:10px; }
  .sig-overall { color:var(--paper); font-weight:500; }
  .sig-overall-max { color:var(--slate); }
  .sig-plats { margin-left:auto; }
  .sig-title { font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:21px; line-height:1.15; margin:0 0 10px; }
  .sig-line { font-size:13.5px; line-height:1.55; margin:0 0 7px; opacity:.95; }
  .sig-line b { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--slate); margin-right:8px; }
  .sig-action b { color:var(--teal); }
  /* score grid */
  .scores { display:grid; grid-template-columns:repeat(3,1fr); gap:8px 18px; margin:14px 0 4px; }
  .score { display:flex; align-items:center; gap:8px; }
  .score-label { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--slate); width:64px; flex-shrink:0; }
  .score-bar { flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden; }
  .score-fill { height:100%; border-radius:3px; }
  .score-num { font-family:'IBM Plex Mono',monospace; font-size:11px; width:10px; text-align:right; }
  .review-flag { font-size:12px; line-height:1.5; color:var(--amber); background:rgba(242,183,5,.08); border:1px solid rgba(242,183,5,.3); border-radius:6px; padding:8px 12px; margin-top:12px; }
  .review-flag b { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase; margin-right:6px; }
  .sig-ev { font-size:12px; line-height:1.5; color:var(--slate); margin:10px 0 0; padding:8px 12px; border-left:2px solid var(--line); background:rgba(255,255,255,.03); border-radius:0 4px 4px 0; }
  .sig-ev b { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase; }

  .listblock { margin-top:24px; }
  .imp-list, .risk-list, .sources-list { margin:0; padding-left:20px; }
  .imp-list li { font-size:13.5px; line-height:1.6; margin-bottom:6px; }
  .risk-list li { font-size:13.5px; line-height:1.6; margin-bottom:6px; color:var(--coral); }
  .sources-block { margin-top:24px; padding-top:16px; border-top:1px solid var(--line); }
  .sources-label { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--slate); margin-bottom:8px; }
  .sources-list li { font-size:11.5px; line-height:1.5; color:var(--slate); }

  .footer { margin-top:28px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; color:var(--slate); line-height:1.6; }

  button:focus-visible, .fld-input:focus-visible, .ptog:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  @media (prefers-reduced-motion:reduce){ .dot,.spin,.skel-bar{animation:none!important} }
  @media (max-width:600px){ .run-actions{width:100%;margin-left:0} .btn{flex:1;justify-content:center} .scores{grid-template-columns:repeat(2,1fr)} .sig-plats{margin-left:0;width:100%} }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
